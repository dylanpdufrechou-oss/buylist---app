<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - I_BuyGames Buylist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="retro-theme">
    <main class="container">
      <header class="top-nav">
        <a href="/" class="brand-link" aria-label="I_BuyGames Buylist home">
          <img
            src="/assets/logo-original.png"
            onerror="this.onerror=null;this.src='/assets/ibuygames-buylist-logo.svg';"
            alt="I_BuyGames Buylist"
            class="brand-logo"
            width="1040"
            height="260"
          />
        </a>
        <h1 class="sr-only">I_BuyGames Buylist</h1>
        <a href="/" class="top-nav-home">Home</a>
      </header>

      <section class="card contact-card">
        <h2 style="margin-top: 0">Contact Us</h2>
        <p class="muted">Send us a message and we will get back to you as soon as possible.</p>
        <div id="contactMessage"></div>
        <form id="contactForm" class="grid">
          <div class="grid two">
            <input id="contactName" placeholder="Name" required />
            <input id="contactEmail" type="email" placeholder="Email" required />
          </div>
          <input id="contactSubject" placeholder="Subject (optional)" />
          <textarea id="contactBody" rows="6" placeholder="Message" required></textarea>
          <div class="row-actions">
            <button id="contactSubmit" type="submit">Send Message</button>
            <a href="/" class="btn-link btn-secondary">Back Home</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/contact.js"></script>
  </body>
</html>
