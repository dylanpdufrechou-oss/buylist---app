services:
  - type: web
    name: i-buygames-buylist
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: buylist-data
      mountPath: /var/data
      sizeGB: 1
